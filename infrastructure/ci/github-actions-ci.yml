name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/mindbridge_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm typecheck
      - name: Tests (unit, HTTP and MongoDB integration)
        run: pnpm test
      - name: Safety engine evaluation report
        run: pnpm --filter @mindbridge/api eval:safety
      - name: Build API and admin
        run: |
          pnpm --filter @mindbridge/api build
          pnpm --filter @mindbridge/admin build
      - name: Bundle mobile app (web target, verifies Metro resolution)
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir /tmp/mobile-web
