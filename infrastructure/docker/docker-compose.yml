# Local full stack: MongoDB + API + admin dashboard.
#   cp apps/api/.env.example apps/api/.env   (fill in secrets)
#   docker compose -f infrastructure/docker/docker-compose.yml up --build
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5

  api:
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: ../../apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/mindbridge
      PORT: "4000"
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["4000:4000"]

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/admin.Dockerfile
      args: { VITE_API_URL: "http://localhost:4000" }
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  mongo-data:
